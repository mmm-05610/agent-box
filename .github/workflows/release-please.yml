# release-please — automatic versioning, CHANGELOG, tag + GitHub Release.
#
# On every push to main it maintains a "release-please" Release PR. Merging it
# bumps the root package metadata and changelog,
# generates CHANGELOG.md, tags v<version> and creates the GitHub Release.
# The publish job then builds the wheel + sdist and attaches them.
#
# Preview artifacts are the root wheel plus the five official plugin wheels.
name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build frontend and all Preview wheels
        run: |
          python -m pip install build
          npm ci --prefix plugins/agent-box-web/frontend
          npm run build --prefix plugins/agent-box-web/frontend
          mkdir -p dist
          python -m build --wheel --sdist --outdir dist .
          for package in plugins/agent-box-web plugins/agent-box-harnesses plugins/agent-box-skills plugins/agent-box-git plugins/agent-box-artifacts \
            plugins/agent-box-runtime-local plugins/agent-box-sandbox-bwrap plugins/agent-box-terminal-session; do
            python -m build --wheel --outdir dist "$package"
          done
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.whl dist/*.tar.gz --clobber
