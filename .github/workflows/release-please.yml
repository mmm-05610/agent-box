# release-please — automatic versioning, CHANGELOG, tag + GitHub Release.
#
# On every push to main it maintains a "release-please" Release PR. Merging it
# bumps the version (pyproject / setup.iss / README badges via extra-files),
# generates CHANGELOG.md, tags v<version> and creates the GitHub Release.
# The publish job then builds the wheel + sdist and attaches them.
#
# Artifacts NOT automated here (Phase 2): Windows installer + Linux GUI
# binary — still uploaded manually to the release.
name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.whl dist/*.tar.gz --clobber
