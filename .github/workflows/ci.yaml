name: CI

# Orchestrator workflow for this repository's surviving surfaces: the Electron
# desktop app (`apps/desktop`), the shared JSON-RPC transport (`apps/shared`)
# and the root JS test workspace (`tests-js`).
#
# This repository is a pure desktop client: the Hermes runtime lives in an
# external install, so there are no Python, docs-site, Docker, nix, installer
# or messaging lanes left to run. Sub-workflows are triggered via
# ``workflow_call`` and keep their own job definitions; they have no
# ``push:`` / ``pull_request:`` triggers of their own.
#
# SECURITY: this workflow runs PR-controlled actions, workflows, and code.
# Do not add ``secrets: inherit`` or GitHub App credentials here.
#
# Branch protection should require ONLY the ``All required checks pass`` job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # JS & TS checks — every workspace's `check` / `check:*` scripts, run in
  # one 32-core job. Always on: there is no lane to gate it against, and an
  # ungated run is the only way a JS change can never slip past.
  # ─────────────────────────────────────────────────────────────────────
  js-tests:
    name: JS & TS checks
    uses: ./.github/workflows/js-tests.yml

  e2e-desktop:
    name: Desktop E2E
    # Disabled (Sep 2026): the Playwright suite is still very flaky. Keep this
    # a bare `if: false`. The earlier `${{ false && (...) }}` form made
    # GitHub's workflow parser fail at startup ("An unexpected error has
    # occurred") — every ci.yaml run repo-wide dispatched 0 jobs from
    # 24f5a60ed1 until the form changed.
    if: false
    uses: ./.github/workflows/e2e-desktop.yml

  lockfile-diff:
    name: Lockfile diff
    uses: ./.github/workflows/lockfile-diff.yml

  case-collision-check:
    name: Case collision check
    uses: ./.github/workflows/case-collision-check.yml

  # ─────────────────────────────────────────────────────────────────────
  # Gate: runs after everything. ``if: always()`` ensures it reports a
  # status even when some deps were skipped. Only actual ``failure``
  # results cause it to fail; ``skipped`` is treated as success.
  # ─────────────────────────────────────────────────────────────────────
  all-checks-pass:
    name: All required checks pass
    needs:
      - js-tests
      - e2e-desktop
      - lockfile-diff
      - case-collision-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          failed = [name for name, info in needs.items() if info['result'] == 'failure']
          for name, info in sorted(needs.items()):
              result = info['result']
              icon = '✅' if result in ('success', 'skipped') else '❌'
              print(f'{icon} {name}: {result}')
          if failed:
              print(f'::error::{len(failed)} job(s) failed: {\", \".join(failed)}')
              sys.exit(1)
          print('All checks passed (or were skipped)')
          "
