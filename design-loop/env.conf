# FE-DESIGN-001 design loop — single source of truth for paths and model calls.
# Every script in design-loop/ sources this file. Nothing here is secret.

FE_ROOT="/home/maoqh/projects/ordessa"
FE_CONTROL="$FE_ROOT/control"
FE_LOOP="$FE_CONTROL/design-loop"
FE_ROLES="$FE_LOOP/roles"
FE_RUN="${FE_RUN:-$FE_CONTROL/reports/FE-DESIGN-001}"
FE_LOGS="$FE_RUN/logs"
FE_TMP="$FE_RUN/.tmp"

# ---- authority boundaries (asserted at runtime, not merely documented) ------
FE_READONLY_ROOTS="$FE_ROOT/repos $FE_ROOT/worktrees $FE_ROOT/releases $FE_ROOT/archive $FE_CONTROL"
FE_WRITE_ROOT="$FE_RUN"
FE_LOCK="$FE_RUN/lock"
FE_LOCK_TOKEN="$FE_RUN/lock.token"

# ---- binaries ---------------------------------------------------------------
QODERCLI="${QODERCLI:-/home/maoqh/.local/bin/qodercli}"
CODEX="${CODEX:-/home/maoqh/.local/bin/codex}"

# ---- worker model (Qoder, no-tool pure-text calls) --------------------------
# I's ruling 2026-09-22: every Qoder role runs on Qwen3.8-Flash, not Efficient.
FE_WORKER_MODEL="${FE_WORKER_MODEL:-Qwen3.8-Flash}"
FE_WORKER_MAX_OUTPUT_TOKENS="${FE_WORKER_MAX_OUTPUT_TOKENS:-16000}"
FE_WORKER_TIMEOUT="${FE_WORKER_TIMEOUT:-1200}"
FE_PHASE_ATTEMPTS="${FE_PHASE_ATTEMPTS:-2}"
FE_MAX_CONSEC_PHASE_FAIL="${FE_MAX_CONSEC_PHASE_FAIL:-6}"

# ---- Sol review model (user-specified; verified present in codex catalog) ---
FE_SOL_MODEL="gpt-5.6-sol"
FE_SOL_TIMEOUT="${FE_SOL_TIMEOUT:-1800}"

# Sol budget is a CALL-COUNT cap, not a token cap. It lives in one file and is
# never reset by restart, resume or a date change.
FE_SOL_BUDGET_ENV="$FE_RUN/sol-budget.env"
FE_SOL_BUDGET_LOG="$FE_RUN/sol-budget.log"
FE_SOL_CAP=10
FE_SOL_FINAL_RESERVE=2

# ---- loop shape -------------------------------------------------------------
# No total round limit and no total wall-clock limit is configured, per I's
# instruction of 2026-09-21. FE_ROUND_CAP is kept only as a backstop for the
# RETIRED bash supervisor (which is disabled) and is set beyond any real run;
# nothing on the active path reads it. The native /loop is not capped.
FE_ROUND_CAP="${FE_ROUND_CAP:-100000}"
# A clean streak of this length is not "finished": it means rotate the attack
# dimension, which is a direction change, not a stop.
FE_STALL_AFTER="${FE_STALL_AFTER:-3}"

# ---- convergence criteria ---------------------------------------------------
FE_SCENARIO_MIN_COVER="${FE_SCENARIO_MIN_COVER:-12}"
FE_CLEAN_ROUNDS_REQUIRED="${FE_CLEAN_ROUNDS_REQUIRED:-3}"

# ---- optional small executable model experiments (bounded) ------------------
FE_EXPERIMENTS="${FE_EXPERIMENTS:-1}"
FE_EXPERIMENT_TIMEOUT="${FE_EXPERIMENT_TIMEOUT:-60}"
FE_EXPERIMENT_MAX_BYTES=262144
