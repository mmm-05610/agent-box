[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-cli"
version = "2.0.0a1"
description = "Execution governance kernel and plugin SDK for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["claude-code", "codex", "agent", "sandbox", "bwrap", "wsl"]
authors = [{name = "mmm-05610", email = "2760376727@qq.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mmm-05610/agent-box"
Repository = "https://github.com/mmm-05610/agent-box"

[project.optional-dependencies]
dev = ["pytest>=7"]
preview = [
  "agent-box-web==2.0.0a1",
  "agent-box-harnesses==2.0.0a1",
  "agent-box-git==2.0.0a1",
  "agent-box-tmux==2.0.0a1",
  "agent-box-artifacts==2.0.0a1",
]
web = ["agent-box-web==2.0.0a1"]

[project.scripts]
agent-box = "agent_box.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_box = ["migrations/*.sql"]
