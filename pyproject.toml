[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-cli"
version = "1.9.0"
description = "Execution governance kernel and local Web Host for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["claude-code", "codex", "agent", "sandbox", "bwrap", "wsl"]
authors = [{name = "mmm-05610", email = "2760376727@qq.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["json5>=0.9", "tomli-w>=1.0", "cmd2>=4.1.0", "PyYAML>=6.0", "tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/mmm-05610/agent-box"
Repository = "https://github.com/mmm-05610/agent-box"

[project.optional-dependencies]
dev = ["pytest>=7"]
acp = ["agent-client-protocol==0.9.0; python_version >= '3.10'"]

[project.scripts]
agent-box = "agent_box.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_box = [
    "templates/**",
    "presets/**",
    "core/agent_types.json",
    "core/provider_endpoints.json",
    "migrations/*.sql",
]

[tool.setuptools.data-files]
"share/agent-box/web" = ["gui-web/dist/index.html", "gui-web/dist/assets/*"]
