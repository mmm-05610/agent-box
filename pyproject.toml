[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "pacthold"
version = "2.0.0a1"
description = "Pacthold: execution governance kernel and plugin SDK for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["claude-code", "codex", "agent", "sandbox", "bwrap", "wsl"]
authors = [{name = "mmm-05610", email = "2760376727@qq.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mmm-05610/agent-box"
Repository = "https://github.com/mmm-05610/agent-box"

[project.optional-dependencies]
dev = ["pytest>=7"]
preview = [
  "agent-box-web==2.0.0a1",
  "agent-box-harness==2.0.0a1",
  "agent-box-skills==2.0.0a1",
  "agent-box-runtime-local==2.0.0a1",
  "agent-box-sandbox-bwrap==2.0.0a1",
  "agent-box-terminal-session==2.0.0a1",
  "agent-box-git==2.0.0a1",
  "agent-box-artifacts==2.0.0a1",
]
web = ["agent-box-web==2.0.0a1"]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "wsproto>=1.2,<2",
  "agent-box-harness==2.0.0a1",
  "agent-box-runtime-wsl==2.0.0a1",
]

[project.scripts]
# Pacthold is the product name; the historical `agent-box*` entry points stay
# as aliases to the same mains (order 61: new name first, old name falls back).
pacthold = "agent_box.cli:main"
pacthold-server = "agent_box.server.__main__:main"
pacthold-server-credential = "agent_box.server.credential_cli:main"
agent-box = "agent_box.cli:main"
agent-box-server = "agent_box.server.__main__:main"
agent-box-server-credential = "agent_box.server.credential_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_box = ["migrations/*.sql"]
