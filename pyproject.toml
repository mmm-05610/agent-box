[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-cli"
version = "1.7.8"
description = "Isolated config launcher for coding agents (Claude Code / Codex / Hermes / OpenCode)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["claude-code", "codex", "agent", "sandbox", "bwrap", "wsl"]
authors = [{name = "mmm-05610", email = "2760376727@qq.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["json5>=0.9", "tomli-w>=1.0", "cmd2>=4.1.0", "PyYAML>=6.0", "tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/mmm-05610/agent-box"
Repository = "https://github.com/mmm-05610/agent-box"

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
dev = ["pytest>=7"]

[project.scripts]
agent-box = "agent_box.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_box = [
    "templates/**",
    "presets/**",
    "core/agent_types.json",
    "core/provider_endpoints.json",
    "migrations/*.sql",
]
