[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-session"
version = "2.0.0a1"
description = "Agent-Box Official Session Store plugin: durable session authority"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
session = "agent_box_session.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
