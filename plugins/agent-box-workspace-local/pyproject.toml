[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-workspace-local"
version = "2.0.0a1"
description = "Agent-Box local live workspace provider plugin"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
workspace-local = "agent_box_workspace_local.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
