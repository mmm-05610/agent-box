[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-skills"
version = "2.0.0a1"
description = "Immutable local Agent Skills resource provider for Agent-Box"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
skills = "agent_box_skills.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
