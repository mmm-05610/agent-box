[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-tmux"
version = "2.0.0a1"
description = "Tmux console resource plugin for Agent-Box"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
tmux = "agent_box_tmux.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
