[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-workspace-wsl"
version = "0.1.0a1"
description = "Agent-Box WSL live workspace provider skeleton"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
workspace-wsl = "agent_box_workspace_wsl.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
