[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-harness-opencode"
version = "0.1.0"
description = "OpenCode Harness Projection P0"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
opencode = "agent_box_harness_opencode.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
