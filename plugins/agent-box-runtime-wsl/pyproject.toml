[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-runtime-wsl"
version = "2.0.0a1"
description = "Bounded WSL Worker connector for AgentBox Server"
requires-python = ">=3.10"
# No sandbox dependency: this package stages bytes and runs a command it is
# handed. Which isolation tool produces that command is the sandbox layer's
# decision, made where the room is composed.
dependencies = ["agent-box-cli==2.0.0a1"]

[tool.setuptools.packages.find]
where = ["src"]
