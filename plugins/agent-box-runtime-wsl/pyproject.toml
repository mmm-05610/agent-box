[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-runtime-wsl"
version = "0.1.0a1"
description = "Agent-Box WSL RuntimeHost primitive skeleton"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
runtime-wsl = "agent_box_runtime_wsl.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
