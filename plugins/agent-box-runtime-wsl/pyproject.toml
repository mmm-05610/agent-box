[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-runtime-wsl"
version = "2.0.0a1"
description = "Bounded WSL Worker connector for AgentBox Server"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1", "agent-box-sandbox-bwrap==2.0.0a1"]

[tool.setuptools.packages.find]
where = ["src"]
