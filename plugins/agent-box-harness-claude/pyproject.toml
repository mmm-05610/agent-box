[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-harness-claude"
version = "0.1.0"
description = "Official Agent-Box Claude Code Harness projection"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1", "agent-box-terminal-session==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
claude = "agent_box_harness_claude.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
