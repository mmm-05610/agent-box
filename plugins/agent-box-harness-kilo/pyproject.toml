[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-harness-kilo"
version = "2.0.0a1"
description = "Kilo CLI Harness integration plugin (H-KILO-001: third per-Agent package, equal-move only)"
requires-python = ">=3.10"
# The host extension API this package's registry import chain reaches through
# `agent_box_harness.registry`. No other dependency joins: the module itself is
# stdlib-only, so the redistribution closure stays exactly as wide as before
# the split.
dependencies = ["pacthold==2.0.0a1"]

# NO entry points on purpose (approval H-KILO-001-release.md): kilo has no
# production entry point today - the capability-absence register stands, and
# adding one here would be capability expansion. Discovery keeps going through
# the legacy `harnesses.toml` declaration (P-C territory, untouched).

[tool.setuptools.packages.find]
where = ["src"]
