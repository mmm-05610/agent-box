[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-preview-resources"
version = "0.1.0"
description = "Preview artifact and profile ResourceProvider adapters"
requires-python = ">=3.10"
dependencies = ["agent-box-cli>=1.9.0"]

[project.entry-points."agent_box.plugins"]
preview-resources = "agent_box_preview_resources.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
