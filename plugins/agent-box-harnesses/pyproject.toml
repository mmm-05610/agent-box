[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-box-harnesses"
version = "0.1.0"
description = "Official Agent-Box Harness integrations"
requires-python = ">=3.10"
dependencies = ["agent-box-cli>=1.9.0", "agent-box-codex>=0.1.0"]
[project.entry-points."agent_box.plugins"]
harnesses = "agent_box_harnesses.plugin:create_plugin"
[tool.setuptools.packages.find]
where = ["src"]
