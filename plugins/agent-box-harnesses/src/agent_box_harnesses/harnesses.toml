schema_version = 1

# Launch facts corrected against docs/research/harness-native-knowledge-2026-09-01/
# (harnesses/<id>/FACTS.md, matrices/agent-box-field-consumption.md).
# Native home relocation and structured-output flags are
# cross-checked and enforced by the per-Harness native Adapters and by the
# Harnesses-owned NativeHomePolicy (native_home/policy.py).

[[harness]]
schema_version = 1
driver = "codex"
capabilities = ["start", "observe", "finish", "stream", "native_continuation"]
[[harness.inputs]]
contract_id = "agent-box.workspace@1"
target = "dispatch-input"
minimum = 1
maximum = 1
[[harness.inputs]]
contract_id = "agent-box.runtime-host@1"
target = "dispatch-input"
minimum = 1
maximum = 1
[[harness.inputs]]
contract_id = "agent-box.sandbox@1"
target = "dispatch-input"
minimum = 1
maximum = 1
[[harness.inputs]]
contract_id = "agent-box.terminal-session@1"
target = "dispatch-input"
minimum = 1
maximum = 1
[[harness.inputs]]
contract_id = "agent-box.profile@1"
target = "dispatch-input"
minimum = 0
maximum = 1
[[harness.inputs]]
contract_id = "agent-box.prompt-fragment@1"
target = "dispatch-input"
minimum = 1
maximum = 32
[[harness.inputs]]
contract_id = "agent-box.launch-selection@1"
target = "dispatch-input"
minimum = 0
maximum = 1
[[harness.inputs]]
contract_id = "agent-box.credential@1"
target = "dispatch-input"
minimum = 0
maximum = 1
[[harness.inputs]]
contract_id = "agent-box.codex-continuation@1"
target = "dispatch-input"
minimum = 0
maximum = 1
[harness.identity]
harness_type = "codex"
display_name = "Codex"
description = "OpenAI Codex Harness"
version = "2.0"
[harness.executable]
identity = "codex"
resolver_kind = "PATH_OR_BUNDLE"
bundle_members = []
version_probe = ["--version"]
[harness.profile]
native_home = ".codex"
guest_home = "/runtime/home"
config_format = "toml"
payload_schema = "codex-profile-v1"
[[harness.launch_modes]]
name = "interactive"
argv = ["codex"]
io = "pty"
[[harness.launch_modes]]
name = "exec"
argv = ["codex", "exec", "--json", "--skip-git-repo-check"]
io = "stdio"
[[harness.launch_modes]]
name = "app-server"
argv = ["codex", "app-server"]
io = "stdio"
[harness.runtime]
network = "required"
[harness.continuation]
kind = "native_session"
contract_id = "agent-box.codex-continuation@1"
target_provider = "codex-continuation"
[harness.credential]
contract = "agent-box.credential@1"
locator_provider = "codex-login"
guest_target_class = "secret-mount"
materializer = "codex-login"

