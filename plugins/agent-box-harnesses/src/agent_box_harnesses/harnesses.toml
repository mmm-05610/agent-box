[[harness]]
schema_version = 1
driver = "opencode"
# 逐项证据见 plugins/agent-box-harnesses/tests/test_capability_declarations.py 的
# FAMILY_MATRIX：真实单文件二进制全链门的重开相位 `createsInsideReopenPhase=[]`、
# `hostStarts>=2`、同一 native session id，且第二轮上下文来自 OpenCode 自己的 SQLite
# 存储，因此 `native_continuation` 是已观测项。`attach` 刻意不声明：驱动在发包前以
# `OPENCODE_ATTACHMENTS_UNSUPPORTED` 显式拒绝附件，native `promptCapabilities.image`
# 也是 false；`permissions` 无任何运行时证据。
capabilities = ["start", "observe", "finish", "stream", "native_continuation"]
[harness.identity]
harness_type = "opencode"
display_name = "OpenCode"
description = "OpenCode Harness"
version = "2.0"
[harness.executable]
identity = "opencode"
resolver_kind = "PATH"
version_probe = ["--version"]
[harness.profile]
native_home = ".config/opencode"
guest_home = "/runtime/home"
config_format = "json"
payload_schema = "opencode-profile-v1"
codec = "opencode"
overlay_policy = "execution-local"
slots = ["provider", "instruction", "mcp", "skill"]
skill_target = "/runtime/home/skills/{skill_id}"
skill_env = "OPENCODE_CONFIG_DIR"
[[harness.inputs]]
contract_id = "agent-box.skill@1"
minimum = 0
maximum = 32
required = false
selectors = ["agent-skill"]
target = "skill-tree"
transformer = "agent-skills"
[[harness.launch_modes]]
name = "exec"
argv = ["opencode", "run"]
io = "stdio"
[harness.runtime]
io = "stdio"
network = "required"
terminal = "stdio"
[harness.continuation]
# 生产链的重开由驱动以 `GET /session/<id>` 完成：门观测到 `created:false`、
# `storedMessages=2`、`createsInsideReopenPhase=[]`，即同一 native session 被重开，
# 不是 Server 端重放 transcript。
kind = "native_session"
contract_id = "agent-box.opencode-continuation@1"
target_provider = "opencode-continuation"

[[harness]]
schema_version = 1
driver = "hermes"
# 逐项证据见 plugins/agent-box-harnesses/tests/test_capability_declarations.py 的
# FAMILY_MATRIX：真实 Hermes 0.19.0 + 假端点全链门直接观测到同 native id 的
# ACP `new_session → resume_session`、`state.db` 回投与第二轮上下文，因此
# `native_continuation` 是已观测项。`permissions` 刻意不声明（未观测到任何运行时
# 权限裁决），`attach` 同样不声明（门的两轮 message.attachments 均为空）。
capabilities = ["start", "observe", "finish", "stream", "native_continuation"]
[harness.identity]
harness_type = "hermes"
display_name = "Hermes"
description = "Hermes Harness"
version = "2.0"
[harness.executable]
identity = "hermes"
resolver_kind = "PATH"
version_probe = ["--version"]
[harness.profile]
native_home = ".hermes"
guest_home = "/runtime/home"
config_format = "json"
payload_schema = "hermes-profile-v1"
codec = "hermes"
overlay_policy = "execution-local"
slots = ["instruction", "mcp", "skill"]
skill_target = "/runtime/home/skills/{skill_id}"
skill_env = "HERMES_HOME"
[[harness.inputs]]
contract_id = "agent-box.skill@1"
minimum = 0
maximum = 32
required = false
selectors = ["agent-skill"]
target = "skill-tree"
transformer = "agent-skills"
[[harness.launch_modes]]
name = "exec"
argv = ["hermes", "--print"]
io = "stdio"
[harness.runtime]
io = "stdio"
network = "required"
terminal = "stdio"
[harness.continuation]
# 生产链走的是 generic sidecar 的 ACP 路径，门直接观测到 Hermes 用 `session/resume`
# 重开同一个 native session（无重放）。`transcript_handoff` 是**另一个**代码路径
# （legacy `HermesExecutionProvider`，它把 transcript 前缀塞进 prompt）的说法，
# 与本注册表描述的生产路径无关；消费方核对结论见回报与能力合同的测试。
kind = "native_session"
contract_id = "agent-box.hermes-continuation@1"
target_provider = "hermes-continuation"

[[harness]]
schema_version = 1
driver = "pi"
# 逐项证据见 plugins/agent-box-harnesses/tests/test_capability_declarations.py 的
# FAMILY_MATRIX：真实 `@automatalabs/pi-acp@0.5.0` 假端点全链门观测到
# start/observe/finish/stream 与同 native id 的重开（第二轮上下文来自 Pi 自己的
# journal）。`attach` 保留为**静态候选**但 observed 只能是 not-observed：真实握手
# 确实播发了 `promptCapabilities {image}`（条件一成立），投递链路
# （`SidecarHarnessPort._start_run` → `port.prompt(..., attachments)` →
# `worker-entry.mjs` → `AcpService.prompt`）也在代码上成立，但没有任何一次运行真的
# 送过非空附件——门的每一轮 `message.attachments` 都是 `[]`。按"不得静默升级"，
# 它没有运行时证据，就不算观测。
capabilities = ["start", "observe", "finish", "attach", "stream", "native_continuation"]
[harness.identity]
harness_type = "pi"
display_name = "Pi"
description = "Pi Harness"
version = "2.0"
[harness.executable]
identity = "pi"
resolver_kind = "PATH"
version_probe = ["--version"]
[harness.profile]
native_home = ".pi"
guest_home = "/runtime/home"
config_format = "json"
payload_schema = "pi-profile-v1"
codec = "pi"
overlay_policy = "execution-local"
slots = ["instruction", "mcp", "skill"]
skill_target = "/runtime/home/skills/{skill_id}"
[[harness.inputs]]
contract_id = "agent-box.skill@1"
minimum = 0
maximum = 32
required = false
selectors = ["agent-skill"]
target = "skill-tree"
transformer = "agent-skills"
[[harness.launch_modes]]
name = "exec"
argv = ["pi", "--agent-dir", "/runtime/home", "--print"]
io = "stdio"
[harness.runtime]
io = "stdio"
network = "required"
terminal = "stdio-or-pty"
[harness.continuation]
kind = "native_session"
contract_id = "agent-box-pi.continuation@1"
target_provider = "pi-session"
