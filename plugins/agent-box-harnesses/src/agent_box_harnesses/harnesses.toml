schema_version = 1

[[harness]]
schema_version = 1
driver = "codex"
capabilities = ["start", "observe", "finish", "attach", "stream", "permissions", "native_continuation"]
[harness.identity]
harness_type = "codex"
display_name = "Codex"
description = "OpenAI Codex Harness"
version = "2.0"
[harness.executable]
identity = "codex"
resolver_kind = "PATH_OR_BUNDLE"
bundle_members = ["codex", "codex-app-server"]
version_probe = ["--version"]
[harness.profile]
native_home = ".codex"
guest_home = "/runtime/home"
config_format = "json-or-toml"
payload_schema = "codex-profile-v1"
codec = "codex"
overlay_policy = "execution-local"
slots = ["provider", "permission", "instruction", "mcp", "skill"]
skill_target = "/runtime/home/skills/{skill_id}"
skill_env = "CODEX_HOME"
[[harness.inputs]]
contract_id = "agent-box.skill@1"
minimum = 0
maximum = 32
required = false
selectors = ["agent-skill"]
target = "skill-tree"
transformer = "agent-skills"
[[harness.launch_modes]]
name = "interactive"
argv = ["codex"]
io = "pty"
[[harness.launch_modes]]
name = "exec"
argv = ["codex", "exec"]
io = "stdio"
[[harness.launch_modes]]
name = "app-server"
argv = ["codex", "app-server"]
io = "stdio"
[harness.runtime]
io = "stdio"
host_capabilities = ["runtime-composition"]
sandbox_capabilities = ["projection"]
network = "required"
terminal = "stdio-or-pty"
[harness.continuation]
kind = "native_session"
contract_id = "agent-box.codex-continuation@1"
target_provider = "codex-continuation"
[harness.credential]
contract = "agent-box.credential@1"
locator_provider = "codex-login"
guest_target_class = "secret-mount"
materializer = "codex-login"

