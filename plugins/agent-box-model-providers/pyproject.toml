[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-model-providers"
version = "2.0.0a1"
description = "Harness-scoped model provider authority (accounts + immutable config revisions) for Agent-Box"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
model-providers = "agent_box_model_providers.entrypoints:create_model_providers"

[tool.setuptools.packages.find]
where = ["src"]
