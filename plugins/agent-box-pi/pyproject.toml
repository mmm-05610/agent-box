[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-pi"
version = "0.1.0"
description = "Pi (DeepSeek) tmux ExecutionProvider plugin for Agent-Box"
requires-python = ">=3.10"
dependencies = ["agent-box-cli>=2.0.0a1,<2.1.0", "agent-box-tmux==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
pi = "agent_box_pi.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
