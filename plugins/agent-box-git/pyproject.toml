[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-git"
version = "0.1.0"
description = "Agent-Box detached Git workspace and output capture plugin"
requires-python = ">=3.10"
dependencies = ["agent-box-cli>=1.9.0"]

[project.entry-points."agent_box.plugins"]
git = "agent_box_git.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
