[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-runtime-local"
version = "2.0.0a1"
description = "Exact local Linux and WSL RuntimeHost adapter for Agent-Box"
requires-python = ">=3.10"
dependencies = ["agent-box-cli==2.0.0a1"]

[project.entry-points."agent_box.plugins"]
runtime-local = "agent_box_runtime_local.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
