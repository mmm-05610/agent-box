[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-harness-dsh"
version = "2.0.0a1"
description = "DeepSeek dsh Harness integration plugin (first per-Agent package, P-B pilot)"
requires-python = ">=3.10"
dependencies = ["pacthold==2.0.0a1"]
# NO entry points on purpose (approval PB-dsh-pilot-release.md §批准): dsh has
# no production entry point today - the capability-absence register stands and
# adding one would be capability expansion. Discovery keeps going through the
# legacy `harnesses.toml` declaration (P-C owns that mechanism, untouched here).
# PyYAML is deliberately NOT declared either: `production` renders lazily and
# not widening the redistribution closure is a hard rule (declared in the
# approval; rendering environments are unchanged).

[tool.setuptools.packages.find]
where = ["src"]
