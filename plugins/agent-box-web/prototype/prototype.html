<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent-Box Workbench Prototype</title>
    <style>
      .profile-form{max-width:920px;display:grid;gap:14px}.profile-form fieldset{margin:0;padding:16px 18px;border:1px solid #c9d2ce;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.profile-form legend{padding:0 5px;font-weight:700}.profile-form label{display:grid;gap:6px;font-size:13px}.profile-form input,.profile-form select{min-width:0;height:38px;border:1px solid #9aa8a1;background:#fff;padding:7px}.list-actions{display:flex;gap:9px;align-items:center;margin-bottom:16px}@media(max-width:900px){.profile-form fieldset{grid-template-columns:1fr}}
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/prototype/main.tsx"></script></body>
