[build-system]
requires = ["setuptools>=61,<77"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-box-harness"
version = "2.0.0a1"
description = "Ordessa Harness integrations, shared contracts and runtime"
requires-python = ">=3.10"
# The Host extension API and the profile/work contracts this core imports.
dependencies = ["pacthold==2.0.0a1", "agent-box-terminal-session==2.0.0a1"]
[project.entry-points."agent_box.plugins"]
harness-profile-store = "agent_box_harness.entrypoints:create_profile_store"
codex = "agent_box_harness.entrypoints:create_codex"
claude = "agent_box_harness.entrypoints:create_claude"
opencode = "agent_box_harness.entrypoints:create_opencode"
hermes = "agent_box_harness.entrypoints:create_hermes"
pi = "agent_box_harness.entrypoints:create_pi"
[tool.setuptools.package-data]
agent_box_harness = ["harnesses.toml", "codex/*.json", "codex/*.toml"]
[tool.setuptools.packages.find]
where = ["src"]
