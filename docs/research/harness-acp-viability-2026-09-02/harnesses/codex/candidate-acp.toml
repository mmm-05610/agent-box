process_topology = "double_spawn_single_tree: ACP client -> node codex-acp wrapper (one per client) -> codex app-server child (exactly one per wrapper, spawned at startup, no daemon) -> transient git child observed at startup; graceful stdin-close ends codex stdin then kill-after-2s fallback, adapter exit 0 observed; SIGKILL-of-wrapper orphan behavior UNKNOWN (no pdeathsig); same process tree, bwrap-wrappable"
