credential_boundary = "adapter never reads/writes credential files and does not touch CODEX_HOME; spawns codex with process.env passed through, so CODEX_API_KEY/OPENAI_API_KEY/DEFAULT_AUTH_REQUEST env and CODEX_HOME (auth.json/keyring per native facts) are the caller-controlled boundaries; authMethods negotiated in initialize (api-key observed; ChatGPT login hidden under NO_BROWSER=1); CODEX_HOME isolation verified: temp home populated, host <user-home>/.codex mtime-untouched; credential contents never read this round"
profile_boundary = "config.toml/profiles/AGENTS.md/skills/rules/hooks/plugins/mcp_servers loaded by codex itself from CODEX_HOME exactly as native (adapter adds CODEX_CONFIG JSON merge into thread config, MODEL_PROVIDER, INITIAL_AGENT_MODE); native CLI-only surfaces not reachable via ACP: -p profile layering, -c dotted overrides, --ephemeral, --output-schema, --skip-git-repo-check, --ignore-user-config"
