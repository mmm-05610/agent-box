command = "hermes acp  (aliases: hermes-acp, python -m acp_adapter; precheck: hermes acp --check; registry-planned launcher @nousresearch/hermes-agent NOT yet published — npm 404; uvx fallback: uvx --from 'hermes-agent[acp]' hermes-acp)"
bundle_members = ["hermes-agent 0.19.0 (python3.12, needs full site-packages tree — acp_adapter, hermes_cli, agent, tools, gateway)", "agent-client-protocol==0.9.0 (official ACP Python SDK, bundled dep of [acp] extra)", "optional: node + agent-browser + Playwright Chromium under <HERMES_HOME>/node/ (browser tools only, via hermes acp --setup-browser)"]
process_topology = "single python process: asyncio main loop owns ACP ndjson-stdio connection; AIAgent.run_conversation executed in ThreadPoolExecutor worker (thread-local approval callback, contextvar isolation, restored after each prompt); MCP servers = child processes (global config.yaml discovery at boot, skippable by host env HERMES_ACP_SKIP_CONFIGURED_MCP=1; per-session mcpServers from session/new registered in-loop); browser tools spawn node/Chromium; no daemon, no relay; all logging to stderr, stdout reserved for protocol frames"
sandbox_status = "partial: HERMES_HOME redirect PROVEN (temp-home boot created full home skeleton, zero credentials -> only terminal auth advertised); launcher requires PYTHONPATH=<user-site> when HOME is isolated (git-install launcher derives user site-packages from HOME; bare HOME swap -> ModuleNotFoundError, PROVEN); stdout must be a pipe/socket/chardev (regular-file redirect breaks asyncio connect_write_pipe, PROVEN); startup lazy_deps may resolve/install optional provider deps over network (observed boto3/bedrock log; actual mutation UNVERIFIED); no ACP-native sandbox layer — relies on host sandbox + native terminal backends"
credential_boundary = "credentials live under <HERMES_HOME>/.env (KEY=VALUE) + provider env vars via hermes_cli.runtime_provider resolver + <HERMES_HOME>/auth.json (OAuth state) + hermes auth pooled credentials; ACP adapter loads .env at entry and only ADVERTISES configured provider (agent auth) plus a terminal setup method id=hermes-setup args=[--setup]; contents never read this round; redaction default on; ACP threat model per source: stdio-only local-trust"
profile_boundary = "HERMES_HOME is the single home/profile override (native profile mechanism = per-profile HERMES_HOME under <root>/profiles/<name>); sessions persisted to shared <HERMES_HOME>/state.db (SessionDB, source='acp') and restorable across process restarts; per-session cwd from ACP newSession binds to task-scoped file/terminal overrides; config.yaml (YAML) + skills/ + memories/ are profile-scoped; --ignore-user-config/--safe-mode apply in ACP mode via env/flags"
capabilities = { initialize = "SUPPORTED (empirical handshake: protocolVersion 1, agentInfo hermes-agent/0.19.0, loadSession=true, image=true, fork/list/resume)", authenticate = "SUPPORTED (provider agent-auth when creds present + terminal auth hermes-setup; empirical: only terminal auth with empty HERMES_HOME)", newSession = "SUPPORTED (cwd binding + mcpServers + config_options accepted)", loadSession = "SUPPORTED (SessionDB state.db, source=acp)", resume = "SUPPORTED", list = "SUPPORTED", fork = "SUPPORTED (deep-copied history)", set_model = "SUPPORTED (ids provider:model, per-session agent rebuild)", set_mode = "SUPPORTED (default/accept_edits/dont_ask -> edit approval policy ask/workspace_session/session)", set_config_option = "PARTIAL in 0.19.0 (accepts edit_approval_policy, returns empty config_options; model-as-config-option arrives 0.20.x #81067/#88630)", prompt = "SUPPORTED (text + images; slash interception; concurrent prompts queued)", stream_text = "SUPPORTED (agent_message_chunk)", thinking = "SUPPORTED (reasoning_callback -> agent_thought_chunk; local status noise suppressed)", tool_calls = "SUPPORTED (start/complete, kind map, FIFO per-name ids, titles, raw_input)", edit_diffs = "SUPPORTED (tool_diff_content for write_file/patch)", usage_tokens = "SUPPORTED (PromptResponse.usage in/out/total/thought/cached_read + native usage_update size/used for Zed context ring)", permission_terminal = "SUPPORTED (allow_once/allow_session/allow_always/deny; timeout denies; allow_always writes permanent allowlist)", permission_edit = "SUPPORTED (EditProposal diff prompt + session-scoped auto-approve policy; .git/.ssh/sensitive never auto-approved)", plan = "SUPPORTED (todo tool -> AgentPlanUpdate)", cancel = "SUPPORTED (cancel_event + agent.interrupt -> stop_reason cancelled)", slash_commands = "SUPPORTED (9 advertised: help/model/tools/context/reset/compact/steer/queue/version)", mcp = "SUPPORTED (config.yaml global + session/new mcpServers per-session)", images_input = "SUPPORTED (PromptCapabilities.image=true)", subagents = "SUPPORTED (delegate_task in hermes-acp toolset, kind=execute)", session_locator = "SUPPORTED via _meta.hermes.sessionProvenance extension (compression lineage/depth)", stop_reasons = "SUPPORTED (end_turn/cancelled/refusal)" }
missing_capabilities = ["usage cost in USD on the ACP surface (tokens only; native -z --usage-file has estimated_cost_usd — ACP sessions leak no per-turn cost)", "client-side fs/read_text_file, fs/write_text_file and terminal/* proxies NOT called (agent reads/writes/executes directly via own tools)", "question/clarify (tool excluded from hermes-acp toolset)", "native protocol-level steer (only slash /steer and /queue text conventions)", "configOptions model picker advertisement in 0.19.0 (0.20.x only)", "audio/other non-text prompt blocks (partially converted; official doc: 'non-text prompt blocks are currently ignored for request text extraction')", "ACP Registry listing (4 open PRs unmerged as of 2026-09-02; npm launcher unpublished)"]
native_fallback = "headless one-shot: hermes -z <PROMPT> (+ --usage-file PATH JSON with estimated_cost_usd/tokens/session_id, approvals auto-bypassed) — this is Agent-Box's current declared launch mode (harnesses.toml argv=[hermes,-z]); interactive: hermes chat/--tui/--cli; server surfaces: hermes serve/dashboard/gateway/mcp serve"
known_risks = ["not in ACP Registry: hosts must register hermes manually (Zed custom agent_servers {command:hermes,args:[acp]}; Codeg custom agent binary/uvx form)", "pinned agent-client-protocol==0.9.0 vs upstream ACP schema 0.11 drift (configOptions path changes; upgrade is VERSION_SENSITIVE)", "startup lazy_deps network side effect (optional provider deps, e.g. boto3) — prewarm or deny in sandbox", "git-install launcher couples module resolution to HOME (needs PYTHONPATH=<user-site> under isolated HOME)", "headless ACP bridges may auto-answer permission requests (officially documented Buzz incident: rm -rf with no prompt) — host must surface/record permission requests", "stdout must remain a pipe (file redirection crashes transport)", "0.19.0 lacks cost reporting and typed config options on ACP surface"]
